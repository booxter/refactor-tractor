id: prefix-lib-maintainers
valid:
# Should not match outside meta block
- |
  {
    maintainers = with maintainers; [];
  }
# Should not match outside maintainers attribute
- |
  {
    meta = {
      licenses = with maintainers; [];
    };
  }
# Should not match with prefix already present
- |
  {
    meta = {
      maintainers = with lib.maintainers; [];
    };
  }
invalid:
- |
  {
    meta = {
      maintainers = with maintainers; [];
    };
  }
- |
  {
    meta.maintainers = with maintainers; [];
  }
- |
  {
    meta = {
      maintainers = [ maintainers.nobody ];
    };
  }

---

id: prefix-lib-licenses
valid:
# Should not match outside meta block
- |
  {
    license = with licenses; [];
  }
# Should not match outside licenses attribute
- |
  {
    meta = {
      maintainers = with licenses; [];
    };
  }
# Should not match with prefix already present
- |
  {
    meta = {
      license = with lib.licenses; [];
    };
  }
invalid:
- |
  {
    meta = {
      license = with licenses; [];
    };
  }
- |
  {
    meta.license = with licenses; [];
  }
- |
  {
    meta = {
      license = [ licenses.bsd ];
    };
  }
